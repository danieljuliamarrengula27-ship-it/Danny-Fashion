<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DANNY FASHION SA & MOZ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f5f5}
.top{background:#FF6A00;color:#fff;padding:8px 5%;display:flex;justify-content:space-between;font-size:12px;font-weight:bold}
.header{background:#fff;padding:12px 5%;display:flex;gap:12px;align-items:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.logo{font-weight:900;color:#FF6A00;font-size:20px;line-height:1}
.search-wrap{flex:1;position:relative}
.search-box{display:flex;border:2.5px solid #FF6A00;border-radius:30px;overflow:hidden}
.search-box input{flex:1;border:none;padding:11px 15px;outline:none}
.search-box button{background:#FF6A00;color:#fff;border:none;padding:0 18px;cursor:pointer}
.cat-toggle{background:#111;color:#fff;border:none;padding:10px 16px;border-radius:20px;font-size:12px;font-weight:bold;cursor:pointer}
.cat-panel{display:none;background:#fff;padding:10px 5%;border-bottom:1px solid #eee;flex-wrap:wrap;gap:8px}
.cat-panel.show{display:flex}
.cat-panel span{background:#f2f2f2;padding
