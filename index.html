<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial}
.header{background:#111;text-align:center;padding:20px;border-bottom:3px solid #c00;position:sticky;top:0;z-index:10}

.produtos{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.prod{background:#111;border:1px solid #333;border-radius:15px;padding:10px;text-align:center}
.prod img{width:100%;height:140px;object-fit:cover;border-radius:10px;background:#222}
.preco{color:#0f0;font-weight:bold;margin:5px 0}
.preco2{color:#aaa;font-size:12px}
.btn{width:100%;background:#25D366;color:#fff;border:none;padding:8px;border-radius:20px;margin-top:5px;font-weight:bold;cursor:pointer}
.titulo-cat{padding:15px;font-size:20px;color:#c00;text-align:center;display:none}
