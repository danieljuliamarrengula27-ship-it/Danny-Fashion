<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DANNY FASHION - 1000 Tipos Diferentes R100-R3000</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f5f5}
.top{background:#FF6A00;color:#fff;padding:8px 5%;font-size:11px;font-weight:700;display:flex;justify-content:space-between}
.header{background:#fff;padding:10px 5%;display:flex;gap:8px;align-items:center;position:sticky;top:0;z-index:300;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.logo{font-weight:900;color:#FF6A00;font-size:18px;line-height:.9}
.cat-toggle{background:#111;color:#fff;border:none;padding:9px 12px;border-radius:20px;font-size:11px;font-weight:bold;cursor:pointer}
.search-wrap{flex:1;position:relative}
.search-box{display:flex;border:2.5px solid #FF6A00;border-radius:30px;overflow:hidden}
.search-box input{flex:1;border:none;padding:10px 14px;outline:none;font-size:13px}
.search-box button{background:#FF6A00;color:#fff;border:none;padding:0 16px;cursor:pointer}
.cat-panel{display:none;background:#fff;padding:10px 5%;gap:6px;flex-wrap:wrap;border-bottom:1px solid #eee;position:sticky;top:54px;z-index:200}
.cat-panel.show{display:flex}
.cat-panel span{background:#f2f2f2;padding:6px 12px;border-radius:20px;font-size:11px;cursor:pointer;font-weight:600}
.cat-panel span.active{background:#FF6A00;color:#fff}
.sugestoes{display:none;position:absolute;top:110%;left:0;right:0;background:#fff;border-radius:15px;box-shadow:0 15px 35px rgba(0,0,0,.2);padding:12px;z-index:400;max-height:380px;overflow:auto}
.sugestoes.show{display:block}
.chip{display:inline-block;padding:6px 12px;background:#f2f2f2;border-radius:20px;font-size:11px;margin:3px;cursor:pointer;font-weight:600}
.filtros-preco{margin:8px 5%;background:#fff;padding:10px 12px;border-radius:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:11px;border-left:4px solid #FF6A00}
.filtros-preco button{padding:6px 12px;border-radius:20px;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:11px;font-weight:600}
.filtros-preco button.active{background:#FF6A00;color:#fff;border-color:#FF6A00}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px;padding:0 5% 20px}
.card{background:#fff;border-radius:10px;overflow:hidden;border:1px solid #eee}
.card img{width:100%;height:150px;object-fit:cover;background:#eee}
.body{padding:7px}
.title{font-size:11px;height:32px;overflow:hidden;line-height:1.3;font-weight:600}
.price{color:#FF6A00;font-weight:800;font-size:12px}
.price-old{font-size:9px;color:#888;text-decoration:line-through}
.meta{font-size:9px;color:#888}
.btn{display:block;background:#FF6A00;color:#fff;text-align:center;padding:5px;border-radius:14px;text-decoration:none;font-size:9px;font-weight:bold;margin-top:4px}
</style>
</head>
<body>
<div class="top"><span>🇿🇦 SA | 🇲🇿 MOZ | R100 - R3000 | 1000 TIPOS DIFERENTES</span><span>+27 65 559 4282</span></div>
<div class="header">
<div class="logo">DANNY<br>FASHION</div>
<button class="cat-toggle" onclick="toggleCat()">☰ Categorias</button>
<div class="search-wrap">
<div class="search-box">
<input type="text" id="pesq" placeholder="Pesquisar: moletom, mom jeans, vestido..." onfocus="abrirSug()" onkeyup="filtrar()">
<button onclick="filtrar()">🔍</button>
</div>
<div id="sug" class="sugestoes">
<h4 style="font-size:10px;color:#888;margin-bottom:6px">TIPOS DIFERENTES - SEM REPETIR</h4>
<div id="chipsSug"></div>
</div>
</div>
</div>
<div id="catPanel" class="cat-panel"></div>
<div class="filtros-preco">
<span><b id="mostrando">0</b> de <b id="total">1000</b> • <span id="filtroInfo">Todos</span></span>
<button class="active" onclick="filtrarPreco(100,3000,'Todos',this)">Todos</button>
<button onclick="filtrarPreco(100,500,'R100-500',this)">R100-500</button>
<button onclick="filtrarPreco(501,1000,'R501-1000',this)">R501-1000</button>
<button onclick="filtrarPreco(1001,2000,'R1001-2000',this)">R1001-2000</button>
<button onclick="filtrarPreco(2001,3000,'R2001-3000',this)">R2001-3000</button>
</div>
<div id="grid" class="grid"></div>
<button id="btnMore" style="display:block;margin:20px auto;background:#111;color:#fff;padding:12px 30px;border-radius:25px;border:none;font-weight:bold;cursor:pointer" onclick="carregarMais()">Carregar mais 40 ↓</button>

<script>
const TIPOS_REAIS = [
{cat:'fato', tipos:["Fato Treino Completo","Moletom Oversize","Hoodie com Capuz","Conjunto Moletom","Jaqueta Bomber"], precoBase: 500},
{cat:'cargo', tipos:["Calça Cargo Militar","Calça Jogger","Calça Alfaiataria","Short Cargo","Bermuda Cargo"], precoBase: 450},
{cat:'jeans', tipos:["Jeans Mom High Waist","Jeans Skinny","Jeans Wide Leg","Jeans Ripped Rasgado","Jaqueta Jeans","Short Jeans","Macacão Jeans","Jardineira Jeans"], precoBase: 550},
{cat:'vestido', tipos:["Vestido Longo Floral","Vestido Curto Justo","Vestido Midi Tubinho","Vestido Festa Brilho","Vestido Ciganinha","Camisola Longa","Kimono Longo"], precoBase: 600},
{cat:'saia', tipos:["Saia Jeans Curta","Saia Longa Plissada","Saia Midi Couro","Saia Lápis"], precoBase: 400},
{cat:'camisa', tipos:["Camisa Social Slim","Camisa Oversize Xadrez","Camisa Polo","T-shirt Básica","T-shirt Oversize"], precoBase: 300},
{cat:'blusa', tipos:["Cropped Top","Blusa Ciganinha","Body Colado","Top Academia","Blusa de Lã"], precoBase: 280},
{cat:'conjunto', tipos:["Conjunto Top + Saia","Conjunto Academia","Pijama Conjunto","Conjunto Criança"], precoBase: 650},
{cat:'sneaker', tipos:["Sneaker Air Max","Sneaker Casual Branco","Tênis Corrida","Bota Cano Alto","Bota Coturno","Sapato Social","Mocassim","Sandália Salto"], precoBase: 700},
{cat:'bolsa', tipos:["Bolsa Transversal","Mochila Escolar","Carteira Couro","Cinto Couro","Mochila Executiva"], precoBase: 450},
{cat:'acessorio', tipos:["Relógio Clássico","Smartwatch","Boné Trucker","Bucket Hat","Meia Longa Kit","Sutiã Push Up","Cueca Box Kit"], precoBase: 200},
{cat:'bebe', tipos:["Vestido Bebê Princesa","Kit Bebê 5 Peças","Body Bebê","Macacão Bebê"], precoBase: 300},
{cat:'crianca', tipos:["Vestido Infantil","Calça Infantil","Conjunto Inverno Infantil"], precoBase: 350}
];
const CATEGORIAS = [...new Set(TIPOS_REAIS.map(t=>t.cat))].map(id=>({id, nome:id.charAt(0).toUpperCase()+id.slice(1)}));
const imagens = [
"https://picsum.photos/seed/1/400/400","https://picsum.photos/seed/2/400/400",
"https://picsum.photos/seed/3/400/400","https://picsum.photos/seed/4/400/400",
"https://picsum.photos/seed/5/400/400","https://picsum.photos/seed/6/400/400",
"https://picsum.photos/seed/7/400/400","https://picsum.photos/seed/8/400/400"
];
let todos = [];
let contador = 0;
while(todos.length < 1000){
TIPOS_REAIS.forEach(grupo=>{
grupo.tipos.forEach(nomeTipo=>{
if(todos.length >= 1000) return;
let variacaoPreco = Math.floor(Math.random()*800) - 200;
let preco = grupo.precoBase + variacaoPreco + (contador % 300);
if(preco < 100) preco = 100 + Math.floor(Math.random()*200);
if(preco > 3000) preco = 1500 + Math.floor(Math.random()*1400);
todos.push({
titulo: nomeTipo,
categoria: grupo.cat,
preco: preco,
precoOld: preco + 150 + Math.floor(Math.random()*300),
img: imagens[contador % imagens.length]
});
contador++;
});
});
}
const chipsSug = document.getElementById('chipsSug');
const catPanel = document.getElementById('catPanel');
CATEGORIAS.forEach(c=>{
chipsSug.innerHTML += `<span class="chip" onclick="usar('${c.id}')">${c.nome}</span>`;
catPanel.innerHTML += `<span data-cat="${c.id}" onclick="usar('${c.id}')">${c.nome}</span>`;
});
let filtrados = [...todos];
let mostrando = 0;
const porPagina = 40;
let filtroPrecoAtivo = {min:100,max:3000};

function render(reset=true){
const grid = document.getElementById('grid');
if(reset){grid.innerHTML=""; mostrando=0;}
let fim = Math.min(mostrando+porPagina, filtrados.length);
for(let i=mostrando;i<fim;i++){
let p = filtrados[i];
grid.innerHTML+=`
<div class="card">
<img src="${p.img}" loading="lazy" onerror="this.src='https://via.placeholder.com/400/FF6A00/fff?text=${p.categoria}'">
<div class="body">
<p class="title">${p.titulo}</p>
<p class="price">R ${p.preco} <span class="price-old">R ${p.precoOld}</span></p>
<p class="meta">${p.categoria.toUpperCase()} • R100-R3000</p>
<a class="btn" href="https://wa.me/27655594282?text=Quero%20${encodeURIComponent(p.titulo)}%20R${p.preco}">Contactar</a>
</div>
</div>`;
}
mostrando=fim;
document.getElementById('mostrando').innerText=mostrando;
document.getElementById('total').innerText=filtrados.length;
document.getElementById('btnMore').style.display = mostrando >= filtrados.length ? 'none' : 'block';
}
function toggleCat(){
document.getElementById('catPanel').classList.toggle('show');
}
function abrirSug(){
document.getElementById('sug').classList.add('show');
}
function fecharSug(){
document.getElementById('sug').classList.remove('show');
}
function usar(cat){
document.getElementById('pesq').value=cat;
filtrar();
fecharSug();
document.querySelectorAll('#catPanel span').forEach(s=>{s.classList.toggle('active', s.dataset.cat===cat)});
}
function filtrar(){
let q = document.getElementById('pesq').value.toLowerCase().trim();
filtrados = todos.filter(p=>{
let matchTexto = !q || p.titulo.toLowerCase().includes(q) || p.categoria.toLowerCase().includes(q);
let matchPreco = p.preco >= filtroPrecoAtivo.min && p.preco <= filtroPrecoAtivo.max;
return matchTexto && matchPreco;
});
document.getElementById('filtroInfo').innerText = q ? q : 'Todos';
render(true);
}
function filtrarPreco(min,max,label,btn){
filtroPrecoAtivo={min,max};
document.getElementById('filtroInfo').innerText=label;
document.querySelectorAll('.filtros-preco button').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
filtrar();
}
function carregarMais(){
render(false);
}
document.addEventListener('click', function(e){
if(!e.target.closest('.search-wrap')) fecharSug();
});
render(true);
</script>
</body>
</html>
