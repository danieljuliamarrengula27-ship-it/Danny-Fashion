<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DANNY - Imagens OK</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f5f5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px;padding:10px 5%}
.card{background:#fff;border-radius:10px;overflow:hidden;border:1px solid #eee}
.card img{width:100%;height:150px;object-fit:cover;background:#eee}
</style>
</head>
<body>
<div id="grid" class="grid"></div>
<script>
const imagens = [
"https://picsum.photos/seed/danny1/400/400",
"https://picsum.photos/seed/danny2/400/400",
"https://picsum.photos/seed/danny3/400/400",
"https://picsum.photos/seed/danny4/400/400"
];
const grid=document.getElementById('grid');
for(let i=1;i<=20;i++){
grid.innerHTML+=`<div class="card"><img src="${imagens[i%4]}" onerror="this.src='https://via.placeholder.com/400/FF6A00/fff?text=Roupa'"><div style="padding:7px"><p style="font-size:11px">Produto #${i} R${100+i*20}</p></div></div>`;
}
</script>
</body>
</html>
