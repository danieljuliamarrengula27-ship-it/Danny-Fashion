<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DANNY FASHION 1000 - Categorias Únicas</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f5f5}
.top{background:#FF6A00;color:#fff;padding:8px 5%;display:flex;justify-content:space-between;font-size:11px;font-weight:700}
.header{background:#fff;padding:10px 5%;display:flex;gap:8px;align-items:center;position:sticky;top:0;z-index:300;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.logo{font-weight:900;color:#FF6A00;font-size:18px;line-height:1}
.cat-toggle{background:#111;color:#fff;border:none;padding:9px 12px;border-radius:20px;font-size:11px;font-weight:bold;cursor:pointer}
.search-wrap{flex:1;position:relative}
.search-box{display:flex;border:2.5px solid #FF6A00;border-radius:30px;overflow:hidden}
.search-box input{flex:1;border:none;padding:10px 14px;outline:none;font-size:13px}
.search-box button{background:#FF6A00;color:#fff;border:none;padding:0 16px;cursor:pointer}
.cat-panel{display:none;background:#fff;padding:10px 5%;gap:6px;flex-wrap:wrap;border-bottom:1px solid #eee;position:sticky;top:54px;z-index:200}
.cat-panel.show{display:flex}
.cat-panel span{background:#f2f2f2;padding:6px 12px;border-radius:20px;font-size:11px;cursor:pointer;font-weight:600;border:1px solid #eee}
.cat-panel span.active{background:#FF6A00;color:#fff;border-color:#FF6A00}
.sugestoes{display:none;position:absolute;top:110%;left:0;right:0;background:#fff;border-radius:15px;box-shadow:0 15px 35px rgba(0,0,0,.2);padding:12px;z-index:400;max-height:380px;overflow:auto}
.sugestoes.show{display:block}
.sugestoes h4{font-size:10px;color:#888;margin:10px 0 5px;text-transform:uppercase}
.chip{display:inline-block;padding:6px 12px;background:#f2f2f2;border-radius:20px;font-size:11px;margin:3px;cursor:pointer;font-weight:600}
.chip:hover{background:#FF6A00;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px;padding:10px 5%}
.card{background:#fff;border-radius:10px;overflow:hidden;border:1px solid #eee}
.card img{width:100%;height:150px;object-fit:cover}
.body{padding:7px}
.title{font-size:11px;height:28px;overflow:hidden}
.price{color:#FF6A00;font-weight:800;font-size:12px}
.meta{font-size:9px;color:#888}
.btn{display:block;background:#FF6A00;color:#fff;text-align:center;padding:5px;border-radius:14px;text-decoration:none;font-size:9px;font-weight:bold;margin-top:4px}
</style>
</head>
<body>

<div class="top"><span>🇿🇦 SA | 🇲🇿 MOZ | 1000 PRODUTOS • CATEGORIAS ÚNICAS</span><span>+27 65 559 4282</span></div>

<div class="header">
<div class="logo">DANNY<br>FASHION</div>
<button class="cat-toggle" onclick="toggleCat()">☰ Categorias Únicas</button>
<div class="search-wrap">
<div class="search-box">
<input type="text" id="pesq" placeholder="Pesquisar em 1000 produtos..." onfocus="abrirSug()" onkeyup="filtrar()">
<button onclick="filtrar()">🔍</button>
</div>
<div id="sug" class="sugestoes">
<h4>🔥 Gostos únicos - sem repetir</h4>
<div id="chipsSug"></div>
</div>
</div>

<div id="catPanel" class="cat-panel"></div>
